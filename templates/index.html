<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Personalized Recommendations</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-background"></div>
    <div class="overlay"></div>



    <div class="container">
        <header class="hero-section">
            <div class="label">Personalized</div>
            <h1>Book Recommendations</h1>
            <p class="subtitle">Powered by Hybrid Machine Learning (TF-IDF & SVD)</p>
            
            <div class="search-container">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="search-input" placeholder="Search for a book you love...">
                    <button id="search-btn">Get Recommendations &rarr;</button>
                </div>
            </div>
            
            <div class="decorative-text">
                &mdash; Find books that feel like home &mdash;
            </div>
        </header>

        <main>
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Curating your personalized library...</p>
            </div>

            <div id="results-section">
                <div class="results-header">
                    <h2>Your Recommendations</h2>
                    <a href="#" class="see-all">See All &rarr;</a>
                </div>
                <div id="recommendation-list" class="grid-container">
                    <!-- Recommendations populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
