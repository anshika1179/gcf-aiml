<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Personalized Book Recommendations</h1>
            <p>Powered by Hybrid Machine Learning (TF-IDF & SVD)</p>
        </header>

        <main>
            <div class="search-section">
                <input type="text" id="search-input" placeholder="Enter a book title or your favorite genre...">
                <button id="search-btn">Get Recommendations</button>
            </div>
            
            <div id="loading" class="hidden">
                <p>Generating recommendations...</p>
            </div>

            <div id="results-section">
                <h2>Your Recommendations</h2>
                <div id="recommendation-list" class="grid-container">
                    <!-- Recommendations will be populated here via JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
